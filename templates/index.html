<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube MP3 Downloader</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🎵 YouTube MP3 Downloader</h1>
            <div class="stats">
                <span class="stat">📥 Queue: <strong id="queue-count">0</strong></span>
                <span class="stat">✓ Downloaded: <strong id="downloaded-count">0</strong></span>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
        </header>

        <!-- Settings Panel (Hidden by default) -->
        <div id="settings-panel" class="settings-panel hidden">
            <h3>Settings</h3>
            <div class="setting-item">
                <label>Audio Quality:</label>
                <select id="audio-quality">
                    <option value="128">128 kbps</option>
                    <option value="192">192 kbps</option>
                    <option value="256">256 kbps</option>
                    <option value="320" selected>320 kbps</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Download Directory:</label>
                <input type="text" id="download-dir" value="./downloads">
            </div>
            <button onclick="saveSettings()">Save Settings</button>
            <button onclick="toggleSettings()">Close</button>
        </div>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-bar">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search YouTube or paste URL..."
                    onkeypress="handleSearchEnter(event)"
                >
                <button onclick="handleSearch()">🔍 Search</button>
            </div>
            <div class="search-type">
                <label>
                    <input type="radio" name="search-type" value="name" checked> Search by Name
                </label>
                <label>
                    <input type="radio" name="search-type" value="url"> Video URL
                </label>
                <label>
                    <input type="radio" name="search-type" value="playlist"> Playlist URL
                </label>
            </div>
        </section>

        <!-- Results Section -->
        <section class="results-section">
            <div class="section-header">
                <h2>Search Results</h2>
                <button id="add-selected-btn" onclick="addSelectedToQueue()" class="hidden">
                    Add Selected to Queue
                </button>
            </div>
            <div id="results-grid" class="results-grid">
                <p class="placeholder">Search for videos to get started</p>
            </div>
        </section>

        <!-- Queue Section -->
        <section class="queue-section">
            <div class="section-header">
                <h2>Download Queue</h2>
                <div class="queue-actions">
                    <button onclick="downloadQueue()" id="download-btn" class="primary-btn" disabled>
                        ⬇️ Download All
                    </button>
                    <button onclick="clearQueue()" id="clear-btn" disabled>
                        🗑️ Clear Queue
                    </button>
                </div>
            </div>
            <div id="queue-grid" class="queue-grid">
                <p class="placeholder">Queue is empty</p>
            </div>
        </section>

        <!-- Download Progress -->
        <div id="download-progress" class="download-progress hidden">
            <h3>Downloading...</h3>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="progress-text">Preparing download...</p>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="toast hidden"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
