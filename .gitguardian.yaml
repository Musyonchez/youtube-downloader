# GitGuardian secret-scanning config.
#
# Excludes tests/ from scanning: auth/session tests necessarily contain
# example username/password pairs (e.g. tests/test_auth_routes.py) that
# GitGuardian's generic "Username Password" detector flags as a hardcoded
# secret. These are test fixtures, not real credentials -- confirmed by
# inspecting the actual flagged content, not dismissed reflexively (see
# docs/09's audit standard: read the finding before deciding it's noise).
version: 2
secret:
  ignored-paths:
    - "tests/**"
