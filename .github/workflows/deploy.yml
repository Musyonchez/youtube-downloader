name: Deploy

# Gated on the CI workflow's own run against master succeeding (not just
# "this push happened to master") -- branch protection already requires
# the check/e2e jobs to pass before a PR can merge, but this adds a
# second, independent gate: deploy only fires after CI's post-merge run
# on master itself reports success.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
