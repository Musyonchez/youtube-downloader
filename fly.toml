# Fly.io app config -- see docs/14-deployment.md for the full deploy
# runbook (volumes, secrets, first-time setup).
app = "yt-mp3-downloader"
primary_region = "iad"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["app"]
  # Kept always-on rather than scale-to-zero: downloads run as background
  # tasks after the triggering HTTP request already returned, so an idle
  # HTTP listener doesn't mean no work is happening -- auto-stop would risk
  # killing an in-progress download the moment the phone/browser that
  # queued it closes its WebSocket connection.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Two volumes, kept separate so they can be sized/backed up independently:
# the SQLite library/history DB + config.json (small, important) vs. the
# actual downloaded MP3s (large, regenerable by re-downloading). Created
# once via `flyctl volumes create` -- see docs/14-deployment.md.
[[mounts]]
  source = "yt_downloader_data"
  destination = "/srv/data"

[[mounts]]
  source = "yt_downloader_downloads"
  destination = "/srv/downloads"
