# Full dependency closure (direct + transitive) for requirements.txt,
# pinned to exact versions (docs/16, 16-15). Without this,
# `pip install -r requirements.txt`'s `>=` bounds mean every build resolves
# to "whatever is newest today", with no reproducibility between a local
# install, CI, and the Dockerfile build, and no review gate on a dependency
# bump (yt-dlp especially updates often).
#
# Generated with `pip freeze` against a clean venv that had only
# requirements.txt installed (not requirements-dev.txt, and not any other
# project's packages -- a shared/reused venv's freeze would pull in
# unrelated noise). Regenerate the same way after changing
# requirements.txt:
#
#   python -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install -r requirements.txt
#   /tmp/lockenv/bin/pip freeze > requirements.lock
#
# and review the diff before committing -- that review is the actual point
# of this file, not just the pinning.
